name: Java CI

on:
  push:
    branches:
      - main-java
      - lab01-java
  pull_request:
    branches:
      - main-java

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B verify

      - name: Verify on Unix
        if: runner.os != 'Windows'
        run: ./mvnw -B verify

      - name: Package on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B package

      - name: Package on Unix
        if: runner.os != 'Windows'
        run: ./mvnw -B package

      - name: Check application version
        run: java -jar target/kzp-java-labs-volos-1.0.0.jar --version

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: kzp-java-labs-volos-${{ matrix.os }}-${{ github.run_number }}
          path: target/kzp-java-labs-volos-1.0.0.jar
          if-no-files-found: error
