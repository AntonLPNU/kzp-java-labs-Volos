name: Java CI

on:
  push:
    branches:
      - main-java
      - lab03-java
  pull_request:
    branches:
      - main-java

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B verify

      - name: Verify on Unix
        if: runner.os != 'Windows'
        run: ./mvnw -B verify

      - name: Package on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B package

      - name: Package on Unix
        if: runner.os != 'Windows'
        run: ./mvnw -B package

      - name: Resolve project version on Windows
        if: runner.os == 'Windows'
        run: |
          $version = .\mvnw.cmd -q help:evaluate "-Dexpression=project.version" -DforceStdout
          "PROJECT_VERSION=$version" >> $env:GITHUB_ENV

      - name: Resolve project version on Unix
        if: runner.os != 'Windows'
        run: echo "PROJECT_VERSION=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_ENV"

      - name: Check application version on Windows
        if: runner.os == 'Windows'
        run: |
          $jar = "target/kzp-java-labs-volos-$env:PROJECT_VERSION.jar"
          $actual = java -jar $jar --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual -ne "kzp-java-labs-volos $env:PROJECT_VERSION") { throw "Unexpected application version: $actual" }

      - name: Check application version on Unix
        if: runner.os != 'Windows'
        run: |
          actual=$(java -jar "target/kzp-java-labs-volos-${PROJECT_VERSION}.jar" --version)
          test "$actual" = "kzp-java-labs-volos ${PROJECT_VERSION}"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: kzp-java-labs-volos-${{ matrix.os }}-${{ github.run_number }}
          path: target/kzp-java-labs-volos-${{ env.PROJECT_VERSION }}.jar
          if-no-files-found: error
